<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスタ作ったお前 特設サイト</title>
    <style>
        :root {
            --main-color: #e04534; /* トマト赤 */
            --bg-color: #fff9f3;   /* パスタベージュ */
            --text-color: #333;
            --accent-color: #4caf50; /* バジル緑 */
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--main-color);
            box-sizing: border-box;
        }

        h1 {
            color: var(--main-color);
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 10px;
            font-weight: 900;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 30px;
        }

        .player-card {
            background: #fafafa;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #eee;
            transition: transform 0.2s;
        }

        .player-card:hover {
            transform: translateY(-2px);
        }

        .player-title {
            font-weight: bold;
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .btn {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(224, 69, 52, 0.2);
            width: 80%;
            display: inline-block;
        }

        .btn:hover {
            background-color: #c83728;
            transform: scale(1.03);
        }

        /* 再生中のスタイル */
        .btn.playing {
            background-color: var(--accent-color);
            box-shadow: 0 4px 6px rgba(76, 175, 80, 0.2);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #999;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>パスタ作ったお前</h1>

    <div class="player-card">
        <div class="player-title">パスタ作ったお前</div>
        <button class="btn" id="btn-pasta" onclick="togglePlay('pasta')">再生する</button>
        <audio id="audio-pasta" src="パスタ作ったお前.mp3" preload="auto"></audio>
    </div>

    <div class="player-card">
        <div class="player-title">純恋歌</div>
        <button class="btn" id="btn-junren" onclick="togglePlay('junren')">再生する</button>
        <audio id="audio-junren" src="純恋歌.mp3" preload="auto"></audio>
    </div>

    <footer>
        <p>&copy; 2026 パスタ作ったお前</p>
    </footer>
</div>

<script>
    function togglePlay(currentId) {
        // 現在クリックされた方の要素を取得
        const currentAudio = document.getElementById('audio-' + currentId);
        const currentButton = document.getElementById('btn-' + currentId);
        
        // もう片方のIDを判定
        const otherId = (currentId === 'pasta') ? 'junren' : 'pasta';
        const otherAudio = document.getElementById('audio-' + otherId);
        const otherButton = document.getElementById('btn-' + otherId);
        
        // 1. もう片方が再生中なら確実に止める
        if (!otherAudio.paused) {
            otherAudio.pause();
            otherAudio.currentTime = 0;
            otherButton.innerText = '再生する';
            otherButton.classList.remove('playing');
        }

        // 2. 自分の再生・停止切り替え
        if (currentAudio.paused) {
            // 再生する
            currentAudio.play().catch(function(error) {
                console.log("再生エラー:", error);
                alert("音源の読み込みに失敗したか、ブラウザが再生をブロックしました。");
            });
            currentButton.innerText = '停止する';
            currentButton.classList.add('playing');
        } else {
            // 停止する
            currentAudio.pause();
            currentAudio.currentTime = 0; // 曲を最初に戻す
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');
        }

        // 3. 曲が最後まで流れ終わったらボタンを元に戻す
        currentAudio.onended = function() {
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');
        };
    }
</script>

</body>
</html>
