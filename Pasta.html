<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスタ作ったお前 特設サイト</title>
    <style>
        :root {
            --main-color: #e04534; /* トマト赤 */
            --bg-color: #fff9f3;   /* パスタベージュ */
            --text-color: #333;
            --accent-color: #4caf50; /* バジル緑 */
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--main-color);
            box-sizing: border-box;
        }

        h1 { color: var(--main-color); font-size: 2.3rem; margin-top: 0; margin-bottom: 10px; font-weight: 900; }
        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .player-card { background: #fafafa; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        .player-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        
        .btn {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 80%;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(224, 69, 52, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn.playing { background-color: var(--accent-color); box-shadow: 0 4px 6px rgba(76, 175, 80, 0.2); }
        footer { margin-top: 30px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h1>パスタ作ったお前</h1>
    <p class="subtitle">~ 大親友の彼女のツレの味 ~</p>

    <div class="player-card">
        <div class="player-title">🎵 詠唱（パスタ作ったお前）</div>
        <button class="btn" id="btn-pasta" 
                onmousedown="handleTrigger(event, 'pasta')" 
                ontouchstart="handleTrigger(event, 'pasta')">再生する</button>
        <audio id="audio-pasta" src="Pasta/pasta.mp3" preload="auto"></audio>
    </div>

    <div class="player-card">
        <div class="player-title">🎤 本編（純恋歌）</div>
        <button class="btn" id="btn-junren" 
                onmousedown="handleTrigger(event, 'junren')" 
                ontouchstart="handleTrigger(event, 'junren')">再生する</button>
        <audio id="audio-junren" src="Pasta/song.mp3" preload="auto"></audio>
    </div>

    <footer>
        <p>&copy; 2026 パスタ作ったお前応援団</p>
    </footer>
</div>

<script>
    let checkInterval = null;

    // ーーー ★1.24秒に最適化★ ーーー
    // 1.54秒から無音の0.3秒を引いた「1.24」をジャストの解除時間に指定
    let unmuteTime = 1.24; 
    // ーーーーーーーーーーーーーーーーー

    function handleTrigger(e, id) {
        e.preventDefault(); 
        togglePlay(id);
    }

    function togglePlay(currentId) {
        const currentAudio = document.getElementById('audio-' + currentId);
        const currentButton = document.getElementById('btn-' + currentId);
        const junrenAudio = document.getElementById('audio-junren');
        
        if (currentAudio.paused) {
            currentAudio.play().catch(error => console.log("再生エラー:", error));
            currentButton.innerText = '停止する';
            currentButton.classList.add('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 0;

                if (checkInterval) clearInterval(checkInterval);

                // 再生位置を高速で監視
                checkInterval = setInterval(function() {
                    if (currentAudio.currentTime >= unmuteTime || currentAudio.paused) {
                        junrenAudio.volume = 1.0;
                        clearInterval(checkInterval);
                    }
                }, 30); // 監視スピードをさらに上げて精度をアップ
            }
        } else {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 1.0;
                if (checkInterval) clearInterval(checkInterval);
            }
        }

        currentAudio.onended = function() {
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 1.0;
                if (checkInterval) clearInterval(checkInterval);
            }
        };
    }
</script>

</body>
</html>
