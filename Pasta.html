<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスタ作ったお前</title>
    <style>
        :root {
            --main-color: #e04534; /* トマト赤 */
            --bg-color: #fff9f3;   /* パスタベージュ */
            --text-color: #333;
            --accent-color: #4caf50; /* バジル緑 */
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--main-color);
            box-sizing: border-box;
        }

        h1 { color: var(--main-color); font-size: 2.3rem; margin-top: 0; margin-bottom: 10px; font-weight: 900; }
        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .player-card { background: #fafafa; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        .player-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        
        .btn {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 80%;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(224, 69, 52, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn.playing { background-color: var(--accent-color); box-shadow: 0 4px 6px rgba(76, 175, 80, 0.2); }
        
        .btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        footer { margin-top: 30px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h1>パスタ作ったお前</h1>

    <div class="player-card">
        <div class="player-title">パスタ作ったお前</div>
        <button class="btn" id="btn-pasta" 
                onmousedown="handleTrigger(event, 'pasta')" 
                ontouchstart="handleTrigger(event, 'pasta')" disabled>読み込み中...</button>
    </div>

    <div class="player-card">
        <div class="player-title">純恋歌</div>
        <button class="btn" id="btn-junren" 
                onmousedown="handleTrigger(event, 'junren')" 
                ontouchstart="handleTrigger(event, 'junren')" disabled>読み込み中...</button>
    </div>

    <footer>
        <p>&copy; 2026 パスタ作ったお前</p>
    </footer>
</div>

<script>
    // Web Audio APIの初期化
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    // 音声データを格納するバッファ
    const buffers = { pasta: null, junren: null };
    // 現在再生中のソースノードを管理
    const activeSources = { pasta: null, junren: null };
    // 純恋歌のボリュームを制御するためのノード
    let junrenGainNode = null;

    // 音源のパス設定
    const audioUrls = {
        pasta: 'Pasta/pasta.mp3',
        junren: 'Pasta/song.mp3'
    };

    // 音量復活のタイミング
    const unmuteTime = 1.7; 

    // 【iPad Safari対策】ユーザーが最初に画面を触った瞬間に音声エンジンを起動させる関数
    function wakeupSafari() {
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        // 音の出ない一瞬のダミーノイズを再生してエンジンを温める
        const buffer = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        source.connect(audioCtx.destination);
        source.start(0);

        // 一度起こせば十分なので、イベントリスナーを解除してメモリを節約する
        window.removeEventListener('touchstart', wakeupSafari);
        window.removeEventListener('mousedown', wakeupSafari);
    }
    // 画面のどこかをタッチ、またはクリックした瞬間に実行
    window.addEventListener('touchstart', wakeupSafari, { passive: true });
    window.addEventListener('mousedown', wakeupSafari, { passive: true });

    // ーーー ページを開いた瞬間に音声データを先読みしてデコード ーーー
    window.addEventListener('DOMContentLoaded', () => {
        const loadAudio = async (id) => {
            try {
                const response = await fetch(audioUrls[id]);
                const arrayBuffer = await response.arrayBuffer();
                // 音声データをブラウザが即座に鳴らせる形式にデコードしてメモリに保存
                buffers[id] = await audioCtx.decodeAudioData(arrayBuffer);
                
                const btn = document.getElementById(`btn-${id}`);
                btn.disabled = false;
                btn.innerText = '再生する';
            } catch (err) {
                console.error(`${id} の読み込み失敗:`, err);
                document.getElementById(`btn-${id}`).innerText = "読み込み失敗";
            }
        };

        Promise.all([loadAudio('pasta'), loadAudio('junren')]);
    });

    async function handleTrigger(e, id) {
        e.preventDefault(); 
        
        // ボタンを押した瞬間、最優先で音声エンジンをアクティブにする（iOSのブロックを力技で突破）
        if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
        }
        
        togglePlay(id);
    }

    function togglePlay(id) {
        const btn = document.getElementById(`btn-${id}`);
        
        // 再生中の場合は停止する
        if (activeSources[id]) {
            stopTrack(id);
            return;
        }

        // 読み込みが完了していない場合は処理しない
        if (!buffers[id]) return;

        // ソースノード（再生プレイヤーのようなもの）を作成
        const source = audioCtx.createBufferSource();
        source.buffer = buffers[id];
        activeSources[id] = source;

        btn.innerText = '停止する';
        btn.classList.add('playing');

        const startTime = audioCtx.currentTime;

        if (id === 'pasta') {
            // パスタが再生されたとき、もし「純恋歌」がすでに流れていたら音量を制御する
            if (activeSources['junren'] && junrenGainNode) {
                // ボタンを押した瞬間（startTime）に純恋歌のボリュームを0にする
                junrenGainNode.gain.setValueAtTime(0, startTime);
                // 指定した秒数（startTime + unmuteTime）に、正確にボリュームを1.0に戻す予約を入れる
                junrenGainNode.gain.setValueAtTime(1.0, startTime + unmuteTime);
            }
        } else if (id === 'junren') {
            // 純恋歌の音量をコントロールするノードを作成して接続
            junrenGainNode = audioCtx.createGain();
            source.connect(junrenGainNode);
            junrenGainNode.connect(audioCtx.destination);
        }

        // 純恋歌以外（パスタ）は直接スピーカーに接続
        if (id !== 'junren') {
            source.connect(audioCtx.destination);
        }

        // 再生終了時の処理
        source.onended = () => {
            // 自然に終了した場合のみボタン表示を元に戻す
            if (activeSources[id] === source) {
                cleanupUI(id);
            }
        };

        // 即座に再生開始
        source.start(startTime);
    }

    function stopTrack(id) {
        if (activeSources[id]) {
            try {
                activeSources[id].stop();
            } catch(e) {}
            cleanupUI(id);
        }
    }

    function cleanupUI(id) {
        activeSources[id] = null;
        const btn = document.getElementById(`btn-${id}`);
        btn.innerText = '再生する';
        btn.classList.remove('playing');

        // パスタが停止された、または終了した際、純恋歌がまだ流れていれば音量を1.0に強制復帰
        if (id === 'pasta' && activeSources['junren'] && junrenGainNode) {
            junrenGainNode.gain.cancelScheduledValues(audioCtx.currentTime);
            junrenGainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);
        }
    }
</script>

</body>
</html>
