<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>パスタ作ったお前</title>
    <style>
        :root {
            --main-color: #e04534; /* トマト赤 */
            --bg-color: #fff9f3;   /* パスタベージュ */
            --text-color: #333;
            --accent-color: #4caf50; /* バジル緑 */
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            max-width: 500px;
            width: 90%;
            border: 3px solid var(--main-color);
            box-sizing: border-box;
        }

        h1 { color: var(--main-color); font-size: 2.3rem; margin-top: 0; margin-bottom: 10px; font-weight: 900; }
        .subtitle { font-size: 1.1rem; color: #666; margin-bottom: 30px; }
        .player-card { background: #fafafa; border-radius: 15px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        .player-title { font-weight: bold; font-size: 1.2rem; margin-bottom: 15px; }
        
        .btn {
            background-color: var(--main-color);
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 80%;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(224, 69, 52, 0.2);
            -webkit-tap-highlight-color: transparent;
        }

        .btn.playing { background-color: var(--accent-color); box-shadow: 0 4px 6px rgba(76, 175, 80, 0.2); }
        
        /* インポート中（準備中）にボタンを少し暗くして触れなくするスタイル */
        .btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        footer { margin-top: 30px; font-size: 0.8rem; color: #999; }
    </style>
</head>
<body>

<div class="container">
    <h1>パスタ作ったお前</h1>

    <div class="player-card">
        <div class="player-title">パスタ作ったお前</div>
        <button class="btn" id="btn-pasta" 
                onmousedown="handleTrigger(event, 'pasta')" 
                ontouchstart="handleTrigger(event, 'pasta')" disabled>読み込み中...</button>
        <audio id="audio-pasta" src="Pasta/pasta.mp3"></audio>
    </div>

    <div class="player-card">
        <div class="player-title">純恋歌</div>
        <button class="btn" id="btn-junren" 
                onmousedown="handleTrigger(event, 'junren')" 
                ontouchstart="handleTrigger(event, 'junren')" disabled>読み込み中...</button>
        <audio id="audio-junren" src="Pasta/song.mp3"></audio>
    </div>

    <footer>
        <p>&copy; 2026 パスタ作ったお前</p>
    </footer>
</div>

<script>
    let checkInterval = null;
    let unmuteTime = 1.24; // 1.54秒 - 0.3秒 = 1.24秒ジャスト

    // ーーー 【超重要】開いた瞬間に自動でインポート（先読み）する処理 ーーー
    window.addEventListener('DOMContentLoaded', () => {
        const pastaAudio = document.getElementById('audio-pasta');
        const junrenAudio = document.getElementById('audio-junren');

        // 音源ファイルをBlob（バイナリデータ）として事前に裏でダウンロード
        const loadAudio = (audioEl, btnId) => {
            return fetch(audioEl.src)
                .then(response => response.blob())
                .then(blob => {
                    // ダウンロードしたデータをブラウザのメモリ内URLに変換して再セット
                    const blobUrl = URL.createObjectURL(blob);
                    audioEl.src = blobUrl;
                    audioEl.load(); // メモリに完全に展開

                    // 準備ができたらボタンを押せるようにする
                    const btn = document.getElementById(btnId);
                    btn.disabled = false;
                    btn.innerText = (btnId === 'btn-pasta') ? '再生する' : '再生する';
                })
                .catch(err => {
                    console.error("インポート失敗:", err);
                    document.getElementById(btnId).innerText = "読み込み失敗";
                });
        };

        // 2つの音源を同時に先行インポート開始
        Promise.all([
            loadAudio(pastaAudio, 'btn-pasta'),
            loadAudio(junrenAudio, 'btn-junren')
        ]);
    });
    // ーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーーー

    function handleTrigger(e, id) {
        e.preventDefault(); 
        togglePlay(id);
    }

    function togglePlay(currentId) {
        const currentAudio = document.getElementById('audio-' + currentId);
        const currentButton = document.getElementById('btn-' + currentId);
        const junrenAudio = document.getElementById('audio-junren');
        
        if (currentAudio.paused) {
            // メモリから直接再生されるため、完全に「ラグ0秒」で即座に鳴ります！
            currentAudio.play().catch(error => console.log("再生エラー:", error));
            currentButton.innerText = '停止する';
            currentButton.classList.add('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 0;

                if (checkInterval) clearInterval(checkInterval);

                checkInterval = setInterval(function() {
                    if (currentAudio.currentTime >= unmuteTime || currentAudio.paused) {
                        junrenAudio.volume = 1.0;
                        clearInterval(checkInterval);
                    }
                }, 15); // さらに監視精度を極限（15msごと）まで引き上げ
            }
        } else {
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 1.0;
                if (checkInterval) clearInterval(checkInterval);
            }
        }

        currentAudio.onended = function() {
            currentButton.innerText = '再生する';
            currentButton.classList.remove('playing');

            if (currentId === 'pasta') {
                junrenAudio.volume = 1.0;
                if (checkInterval) clearInterval(checkInterval);
            }
        };
    }
</script>

</body>
</html>
