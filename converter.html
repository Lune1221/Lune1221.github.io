<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声変換・増幅ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="Converter/css/style.css">
</head>
<body>

    <div class="container">
        <h1>音声ファイル変換・増幅ツール</h1>
        
        <div class="toolbar" id="toolbar" style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; width: 100%; justify-content: center;">
                <div>
                    <label for="globalExtSelect" style="font-size: 13px; font-weight: bold;">一括拡張子 (変換先):</label>
                    <select id="globalExtSelect">
                        <option value="wav">wav</option>
                        <option value="mp3">mp3</option>
                        <option value="m4a">m4a</option>
                        <option value="flac">flac</option>
                        <option value="ogg">ogg</option>
                    </select>
                </div>
            </div>
            <div class="batch-volume-area" style="width: 100%; max-width: 400px; display: flex; align-items: center; gap: 10px;">
                <label for="batchVolumeSlider">🔊 一括音量:</label>
                <input type="range" id="batchVolumeSlider" min="0" max="10" step="0.05" value="1" style="flex-grow: 1;">
                <input type="number" id="batchVolumeNumber" class="volume-input-number" min="0" max="1000" value="100" style="width: 60px;"> %
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>音声ファイルを選択またはドロップ</p>
            <label class="btn" for="fileInput">ファイルを選ぶ</label>
            <input type="file" id="fileInput" multiple>
        </div>

        <div id="status"></div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="file-list" id="fileList" style="display: none;"></div>
        <div class="actions" id="actionArea" style="display: none;">
            <button class="btn btn-success" id="downloadAllBtn">個別ダウンロード</button>
            <button class="btn" id="downloadZipBtn">ZIPで一括ダウンロード</button>
        </div>
    </div>

    <!-- 簡易コンソールボックス -->
    <div id="consoleBox" style="position: fixed; bottom: 0; left: 0; width: 100%; max-height: 150px; background: rgba(0,0,0,0.85); color: #00ff00; font-family: monospace; font-size: 12px; padding: 10px; box-sizing: border-box; overflow-y: auto; z-index: 9999; display: none;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding-bottom: 4px; margin-bottom: 5px;">
            <span>🖥️ 簡易コンソール</span>
            <div>
                <button onclick="clearConsole()" style="background: #444; color: #fff; border: none; padding: 2px 6px; cursor: pointer; font-size: 10px;">クリア</button>
                <button onclick="toggleConsole()" style="background: #444; color: #fff; border: none; padding: 2px 6px; cursor: pointer; font-size: 10px;">閉じる</button>
            </div>
        </div>
        <div id="consoleLogs"></div>
    </div>

    <!-- コンソールを開閉するフローティングボタン -->
    <button onclick="toggleConsole()" style="position: fixed; bottom: 10px; right: 10px; z-index: 10000; background: #333; color: #fff; border: 1px solid #666; border-radius: 4px; padding: 5px 10px; font-size: 12px; cursor: pointer;">
        🖥️ ログ表示
    </button>

    <script src="Converter/js/audio.js"></script>
    <script src="Converter/js/app.js"></script>
</body>
</html>
