<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声変換・増幅ツール</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="Converter/css/style.css">
</head>
<body>

    <div class="container">
        <h1>音声ファイル変換・増幅ツール</h1>
        
        <!-- ツールバー：読み込み前に設定可能 -->
        <div class="toolbar" id="toolbar" style="display: flex;">
            <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center; width: 100%; justify-content: center;">
                <div>
                    <label for="inputExtSelect" style="font-size: 13px; font-weight: bold;">変換元:</label>
                    <select id="inputExtSelect">
                        <option value="all">すべてのファイル</option>
                        <option value="wav">wav</option>
                        <option value="mp3">mp3</option>
                        <option value="m4a">m4a</option>
                        <option value="flac">flac</option>
                        <option value="ogg">ogg</option>
                    </select>
                </div>
                <div>
                    <label for="globalExtSelect" style="font-size: 13px; font-weight: bold;">→ 変換先:</label>
                    <select id="globalExtSelect">
                        <option value="wav">wav</option>
                        <option value="mp3">mp3</option>
                        <option value="m4a">m4a</option>
                        <option value="flac">flac</option>
                        <option value="ogg">ogg</option>
                    </select>
                </div>
            </div>
            <div class="batch-volume-area">
                <label for="batchVolumeSlider">🔊 一括音量:</label>
                <input type="range" id="batchVolumeSlider" min="0" max="10" step="0.05" value="1" style="flex-grow: 1;">
                <input type="number" id="batchVolumeNumber" class="volume-input-number" min="0" max="1000" value="100"> %
            </div>
        </div>

        <div class="drop-zone" id="dropZone">
            <p>音声ファイルを選択またはドロップ</p>
            <label class="btn" for="fileInput">ファイルを選ぶ</label>
            <input type="file" id="fileInput" multiple accept=".wav,.mp3,.m4a,.flac,.ogg,.zip">
        </div>

        <div id="status"></div>
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <div class="file-list" id="fileList" style="display: none;"></div>
        <div class="actions" id="actionArea" style="display: none;">
            <button class="btn btn-success" id="downloadAllBtn">個別ダウンロード</button>
            <button class="btn" id="downloadZipBtn">ZIPで一括ダウンロード</button>
        </div>
    </div>

    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3>パスワード入力</h3>
            <input type="password" id="zipPasswordInput">
            <button class="btn" id="submitPasswordBtn">決定</button>
        </div>
    </div>

    <script src="Converter/js/audio.js"></script>
    <script src="Converter/js/app.js"></script>
</body>
</html>
