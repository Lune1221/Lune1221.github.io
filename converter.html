<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音声ファイル変換・増幅ツール</title>
    <!-- ZIP処理用のライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>音声ファイル変換・増幅ツール</h1>
        <p>一括変換・音量指定・ファイル検索・拡張子変更対応</p>

        <div class="drop-zone" id="dropZone">
            <p>ここに音声ファイル（各種音声、ZIP等）をドロップ<br>または</p>
            <label class="btn" for="fileInput">ファイルを選ぶ</label>
            <input type="file" id="fileInput" multiple accept="audio/*,.zip">
        </div>

        <div id="status"></div>
        
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar" id="progressBar">0%</div>
        </div>

        <!-- ツールバー -->
        <div class="toolbar" id="toolbar">
            <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center; width: 100%;">
                <input type="text" id="searchInput" placeholder="🔍 ファイル名で検索..." style="flex-grow: 1;">
                <select id="sortSelect">
                    <option value="name-asc">名前順 (昇順 A→Z)</option>
                    <option value="name-desc">名前順 (降順 Z→A)</option>
                </select>
                <div>
                    <label for="globalExtSelect" style="font-size: 13px; font-weight: bold;">一括拡張子:</label>
                    <select id="globalExtSelect">
                        <option value="wav">wav</option>
                        <option value="aiff">aiff</option>
                        <option value="aif">aif</option>
                        <option value="flac">flac</option>
                        <option value="m4a">m4a</option>
                        <option value="mp3">mp3</option>
                        <option value="aac">aac</option>
                        <option value="ogg">ogg</option>
                        <option value="wma">wma</option>
                        <option value="opus">opus</option>
                    </select>
                </div>
            </div>
            <div class="batch-volume-area">
                <label for="batchVolumeSlider">🔊 一括音量:</label>
                <input type="range" id="batchVolumeSlider" min="0" max="10" step="0.05" value="1" style="flex-grow: 1;">
                <input type="number" id="batchVolumeNumber" class="volume-input-number" min="0" max="1000" value="100"> %
            </div>
        </div>

        <div class="file-list" id="fileList" style="display: none;"></div>

        <div class="actions" id="actionArea" style="display: none;">
            <button class="btn btn-success" id="downloadAllBtn">すべて個別にダウンロード</button>
            <button class="btn" id="downloadZipBtn">ZIPにまとめてダウンロード</button>
        </div>
    </div>

    <!-- パスワード入力モーダル -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3>ZIPのパスワードが必要です</h3>
            <p id="modalFileName" style="font-size: 13px; margin: 5px 0 15px 0;"></p>
            <input type="password" id="zipPasswordInput" placeholder="パスワードを入力">
            <br>
            <button class="btn" id="submitPasswordBtn">決定</button>
        </div>
    </div>

    <!-- 分割したスクリプトの読み込み（順番に注意） -->
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
