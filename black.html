<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>黒背景透過ツール</title></head>
<body style="font-family:sans-serif;padding:20px;background:#222;color:#fff;">
<h3>黒背景を透明化（スクリーン合成風）</h3>
<p>bgstage_light を選択してください：</p>
<input type="file" id="f" accept="image/*"><br><br>
<p id="msg"></p>
<img id="res" style="max-width:100%;border:1px solid #666;">
<script>
document.getElementById('f').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = function() {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const d = ctx.getImageData(0, 0, c.width, c.height);
    const p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      const max = Math.max(p[i], p[i+1], p[i+2]);
      if (max < 15) { p[i+3] = 0; }
      else { p[i+3] = Math.min(255, max * 2); }
    }
    ctx.putImageData(d, 0, 0);
    document.getElementById('res').src = c.toDataURL('image/png');
    document.getElementById('msg').textContent = '下の画像を長押しして「"写真"に保存」またはファイル保存してください：';
  };
  img.src = URL.createObjectURL(file);
};
</script></body></html>
