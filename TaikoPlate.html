<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓風 段位プレートメーカー</title>
    <style>
        @font-face {
            font-family: 'TaikoFont';
            src: url('FOT-大江戸勘亭流 Std E.otf') format('opentype');
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161623;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2e2e4f;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #8a8a9e;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #4e4e7d;
            background: #0f0f1a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00fff0;
        }
        .canvas-container {
            margin: 25px 0;
            overflow-x: auto;
        }
        canvas {
            background: #222;
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background: linear-gradient(135deg, #00fff0, #0083ff);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,240,0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>太鼓風 段位プレートメーカー</h2>
    
    <div class="control-group">
        <label for="plateType">プレートの種類（背景色）</label>
        <select id="plateType">
            <option value="wood_orange">五級〜一級（薄茶色の木目）</option>
            <option value="wood_blue">初段〜五段（青色の木目）</option>
            <option value="wood_red">六段〜十段（赤色の木目）</option>
            <option value="wood_silver">玄人〜超人（銀色の木目）</option>
            <option value="wood_gold">達人（金色の木目）</option>
            <option value="wood_white">白（創作・外伝など）</option>
        </select>
    </div>

    <div class="control-group">
        <label for="danName">表示する文字</label>
        <input type="text" id="danName" value="達人" maxlength="6" placeholder="段位名を入力">
    </div>
    
    <div class="canvas-container">
        <canvas id="plateCanvas" width="500" height="190"></canvas>
    </div>
    
    <button id="downloadBtn">画像を保存する (.png)</button>
</div>

<script>
    const canvas = document.getElementById('plateCanvas');
    const ctx = canvas.getContext('2d');
    const danInput = document.getElementById('danName');
    const plateTypeSelect = document.getElementById('plateType');
    const downloadBtn = document.getElementById('downloadBtn');

    // 読み込み完了フラグ
    let loadedCount = 0;
    const totalImages = 2;

    function onImageLoad() {
        loadedCount++;
        // 2枚の画像が両方とも読み込み完了したら描画する
        if (loadedCount >= totalImages) {
            drawPlate();
        }
    }

    const imgFrame = new Image();
    imgFrame.onload = onImageLoad;
    imgFrame.src = 'dani_Slice_3_.png'; 

    const imgSprites = new Image();
    imgSprites.src = '段位プレート.png'; 
    imgSprites.onload = onImageLoad;

    // 画像切り抜き座標の定義
    const spritePositions = {
        wood_orange: { x: 15,  y: 15,  w: 110, h: 225 }, 
        wood_blue:   { x: 15,  y: 285, w: 110, h: 225 }, 
        wood_red:    { x: 15,  y: 550, w: 110, h: 225 }, 
        wood_silver: { x: 145, y: 15,  w: 110, h: 225 }, 
        wood_gold:   { x: 145, y: 285, w: 110, h: 225 }, 
        wood_white:  { x: 145, y: 550, w: 110, h: 225 }  
    };

    function drawPlate() {
        // 画像がまだ読み込まれていない場合は処理をスキップしてフリーズを防ぐ
        if (loadedCount < totalImages) return;

        const text = danInput.value || "達人";
        const selectedType = plateTypeSelect.value;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 木目背景を切り抜いて回転描画
        const pos = spritePositions[selectedType];
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-90 * Math.PI / 180); 
        ctx.drawImage(
            imgSprites, 
            pos.x, pos.y, pos.w, pos.h, 
            -canvas.height / 2 + 12, -canvas.width / 2 + 12, 
            canvas.height - 24, canvas.width - 24
        );
        ctx.restore();

        // 2. 外枠（dani_Slice_3_.png）を重ねて回転描画
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate(-90 * Math.PI / 180); 
        ctx.drawImage(imgFrame, -canvas.height / 2, -canvas.width / 2, canvas.height, canvas.width);
        ctx.restore();

        // 3. 文字の描画
        ctx.font = "italic bold 70px 'TaikoFont', 'Hiragino Kaku Gothic ProN', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const x = canvas.width / 2;
        const y = canvas.height / 2 + 5; 

        ctx.lineJoin = 'round';
        
        // 黒フチ（太）
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 18;
        ctx.strokeText(text, x, y);

        // 白フチ（中）
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.strokeText(text, x, y);

        // 黒フチ（細）
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(text, x, y);

        // 文字本体のグラデーション
        let textGrad = ctx.createLinearGradient(0, y - 35, 0, y + 35);
        if (selectedType === 'wood_gold') {
            textGrad.addColorStop(0, '#ff2a2a');
            textGrad.addColorStop(1, '#ff9f00');
        } else if (selectedType === 'wood_silver') {
            textGrad.addColorStop(0, '#d12eff');
            textGrad.addColorStop(1, '#6300b3');
        } else {
            textGrad.addColorStop(0, '#ffffff');
            textGrad.addColorStop(1, '#dddddd');
        }
        
        ctx.fillStyle = textGrad;
        ctx.fillText(text, x, y);
    }

    // フォーム操作時のリアルタイム描画
    danInput.addEventListener('input', drawPlate);
    plateTypeSelect.addEventListener('change', drawPlate);

    // 画像保存
    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `${danInput.value || '段位'}_plate.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
