<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓風 段位プレートメーカー</title>
    <style>
        @font-face {
            font-family: 'TaikoFont';
            src: url('FOT-大江戸勘亭流 Std E.otf') format('opentype');
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161623;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2e2e4f;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #8a8a9e;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #4e4e7d;
            background: #0f0f1a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00fff0;
        }
        .canvas-container {
            margin: 25px 0;
            overflow-x: auto;
        }
        canvas {
            background: #222; /* 読み込み中と分かるように背景を少し明るいグレーに */
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        button {
            background: linear-gradient(135deg, #00fff0, #0083ff);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,240,0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>太鼓風 段位プレートメーカー</h2>
    
    <div class="control-group">
        <label for="plateType">プレートの種類（背景色）</label>
        <select id="plateType">
            <option value="wood_orange">五級〜一級（薄茶色の木目）</option>
            <option value="wood_blue">初段〜五段（青色の木目）</option>
            <option value="wood_red">六段〜十段（赤色の木目）</option>
            <option value="wood_silver">玄人〜超人（銀色の木目）</option>
            <option value="wood_gold">達人（金色の木目）</option>
            <option value="wood_white">白（創作・外伝など）</option>
        </select>
    </div>

    <div class="control-group">
        <label for="danName">表示する文字</label>
        <input type="text" id="danName" value="達人" maxlength="6" placeholder="段位名を入力">
    </div>
    
    <div class="canvas-container">
        <canvas id="plateCanvas" width="500" height="160"></canvas>
    </div>
    
    <button id="downloadBtn">画像を保存する (.png)</button>
</div>

<script>
    const canvas = document.getElementById('plateCanvas');
    const ctx = canvas.getContext('2d');
    const danInput = document.getElementById('danName');
    const plateTypeSelect = document.getElementById('plateType');
    const downloadBtn = document.getElementById('downloadBtn');

    // 画像素材の設定
    const imgFrame = new Image();
    imgFrame.src = 'dani_Slice_3_.png'; 

    const imgSprites = new Image();
    imgSprites.src = '段位プレート.png'; 

    // 画像が読み込めても拒否されても、とにかく画面を描画する
    imgFrame.onload = () => { drawPlate(); };
    imgSprites.onload = () => { drawPlate(); };
    
    // エラーが起きたことが分かるようにログを出す設定
    imgFrame.onerror = () => { console.error("外枠画像の読み込みに失敗しました。ファイル名がズレている可能性があります。"); };
    imgSprites.onerror = () => { console.error("まとめ画像の読み込みに失敗しました。ファイル名がズレている可能性があります。"); };

    const spritePositions = {
        wood_orange: { x: 15,  y: 35,  w: 120, h: 250 }, 
        wood_blue:   { x: 15,  y: 300, w: 120, h: 250 }, 
        wood_red:    { x: 15,  y: 570, w: 120, h: 250 }, 
        wood_silver: { x: 160, y: 35,  w: 120, h: 250 }, 
        wood_gold:   { x: 160, y: 300, w: 120, h: 250 }, 
        wood_white:  { x: 160, y: 570, w: 120, h: 250 }  
    };

    function drawPlate() {
        const text = danInput.value || "達人";
        const selectedType = plateTypeSelect.value;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 仮の背景色を塗る（画像が読み込めなくても黒画面にならないようにする）
        ctx.fillStyle = "#333";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 1. 木目画像の描画（読み込み完了時のみ）
        if (imgSprites.complete && imgSprites.naturalWidth !== 0) {
            const pos = spritePositions[selectedType];
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-90 * Math.PI / 180); 
            ctx.drawImage(imgSprites, pos.x, pos.y, pos.w, pos.h, -canvas.height/2 + 10, -canvas.width/2 + 10, canvas.height - 20, canvas.width - 20);
            ctx.restore();
        }

        // 2. 外枠画像の描画（読み込み完了時のみ）
        if (imgFrame.complete && imgFrame.naturalWidth !== 0) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(-90 * Math.PI / 180); 
            ctx.drawImage(imgFrame, -canvas.height / 2, -canvas.width / 2, canvas.height, canvas.width);
            ctx.restore();
        } else {
            // 画像がない場合は仮の黄色い枠線を引く
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 4;
            ctx.strokeRect(10, 10, canvas.width - 20, canvas.height - 20);
        }

        // 3. 文字の描画（画像がなくても必ず実行される）
        ctx.font = "italic bold 65px 'TaikoFont', 'Hiragino Kaku Gothic ProN', sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const x = canvas.width / 2;
        const y = canvas.height / 2 + 6; 

        ctx.lineJoin = 'round';
        
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 18;
        ctx.strokeText(text, x, y);

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 10;
        ctx.strokeText(text, x, y);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 4;
        ctx.strokeText(text, x, y);

        let textGrad = ctx.createLinearGradient(0, y - 30, 0, y + 30);
        if (selectedType === 'wood_gold') {
            textGrad.addColorStop(0, '#ff2a2a');
            textGrad.addColorStop(1, '#ff9f00');
        } else if (selectedType === 'wood_silver') {
            textGrad.addColorStop(0, '#d12eff');
            textGrad.addColorStop(1, '#6300b3');
        } else {
            textGrad.addColorStop(0, '#ffffff');
            textGrad.addColorStop(1, '#dddddd');
        }
        
        ctx.fillStyle = textGrad;
        ctx.fillText(text, x, y);
    }

    // 初回に一度強制的に描画を実行
    drawPlate();

    danInput.addEventListener('input', drawPlate);
    plateTypeSelect.addEventListener('change', drawPlate);

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = `${danInput.value || '段位'}_plate.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
