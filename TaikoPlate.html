<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓風 縦型段位プレートメーカー</title>
    <style>
        @font-face {
            font-family: 'TaikoFont';
            src: url('https://github.com/Lune1221/Lune1221.github.io/raw/refs/heads/main/FOT-%E5%A4%A7%E6%B1%9F%E6%88%B8%E5%8B%98%E4%BA%AD%E6%B5%81%20Std%20E.otf') format('opentype');
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #161623;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2e2e4f;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #8a8a9e;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #4e4e7d;
            background: #0f0f1a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00fff0;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .canvas-container {
            margin: 20px 0;
            text-align: center;
        }
        canvas {
            display: none; /* 内部処理用 */
        }
        .result-image {
            max-width: 100%;
            max-height: 480px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .note {
            color: #ff4757;
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>太鼓風 縦型プレートメーカー</h2>
    
    <div class="control-group">
        <label for="bgSelect">プレートの背景（木目）</label>
        <select id="bgSelect">
            <option value="images/Yellow_Plate.png">五級〜一級（黄色）</option>
            <option value="images/Blue_Plate.png">初段〜五段（青色）</option>
            <option value="images/Red_Plate.png">六段〜十段（赤色）</option>
            <option value="images/Silver_Plate.png">玄人〜超人（銀色）</option>
            <option value="images/Gold_Plate.png">達人（金色）</option>
            <option value="images/White_Plate.png">白（創作・外伝など）</option>
        </select>
    </div>

    <div class="control-group">
        <label>文字の配置方法</label>
        <div class="radio-group">
            <label><input type="radio" name="textMode" value="preset" checked> 公式パーツを使う</label>
            <label><input type="radio" name="textMode" value="custom"> 自由に入力する</label>
        </div>
    </div>

    <div class="control-group" id="presetGroup">
        <label for="presetSelect">公式文字パーツ</label>
        <select id="presetSelect">
            <option value="images/TATSUJIN.png">達人</option>
            <option value="images/KUROTO.png">玄人</option>
            <option value="images/CHOJIN.png">超人</option>
            <option value="images/MEIJIN.png">名人</option>
            <option value="images/Gaiden.png">外伝</option>
            <option value="images/Original.png">創作</option>
        </select>
    </div>

    <div class="control-group" id="customGroup" style="display: none;">
        <label for="customInput">自由な文字（※1文字ずつ改行されます）</label>
        <input type="text" id="customInput" value="初段" maxlength="4">
    </div>
    
    <div class="canvas-container">
        <canvas id="plateCanvas" width="240" height="520"></canvas>
        <img id="plateView" class="result-image" alt="段位プレート">
        <p class="note">【保存方法】上のプレート画像を長押しして保存してください</p>
    </div>
</div>

<script>
    const canvas = document.getElementById('plateCanvas');
    const ctx = canvas.getContext('2d');
    const plateView = document.getElementById('plateView');
    
    const bgSelect = document.getElementById('bgSelect');
    const textModeRadios = document.getElementsByName('textMode');
    const presetGroup = document.getElementById('presetGroup');
    const presetSelect = document.getElementById('presetSelect');
    const customGroup = document.getElementById('customGroup');
    const customInput = document.getElementById('customInput');

    let imgBg = new Image();
    let imgText = new Image();

    imgBg.onload = onAssetLoad;
    imgText.onload = onAssetLoad;

    document.fonts.load("12px 'TaikoFont'").then(() => {
        drawPlate();
    });

    function onAssetLoad() {
        drawPlate();
    }

    function updateModeVisibility() {
        const mode = document.querySelector('input[name="textMode"]:checked').value;
        if (mode === 'preset') {
            presetGroup.style.display = 'block';
            customGroup.style.display = 'none';
        } else {
            presetGroup.style.display = 'none';
            customGroup.style.display = 'block';
        }
        loadAssets();
    }

    function loadAssets() {
        imgBg.src = bgSelect.value;
        const mode = document.querySelector('input[name="textMode"]:checked').value;
        if (mode === 'preset') {
            imgText.src = presetSelect.value;
        } else {
            imgText.src = '';
            drawPlate();
        }
    }

    function drawPlate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. 背景の木目板を描画（等倍で重ねる）
        if (imgBg.complete && imgBg.naturalWidth !== 0) {
            ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
        }

        const mode = document.querySelector('input[name="textMode"]:checked').value;

        if (mode === 'preset') {
            // 2-A. 【完全修正】公式パーツをズレや縮小なしで「等倍（100%）」でそのまま重ねる
            // これにより、あなたの切り抜きそのままの完璧な配置（ド真ん中）になります。
            if (imgText.complete && imgText.naturalWidth !== 0) {
                ctx.drawImage(imgText, 0, 0, canvas.width, canvas.height);
            }
        } else {
            // 2-B. 【完全修正】自由入力テキストのバグを修正
            const text = customInput.value || "初段";
            
            // 本家と同じド迫力のサイズ（110px）に拡大
            ctx.font = "italic bold 110px 'TaikoFont', 'Hiragino Kaku Gothic ProN', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            const chars = text.split('');
            // 文字が中央に綺麗に収まる開始位置の計算
            const startY = (canvas.height / 2) - ((chars.length - 1) * 60) - 40;

            chars.forEach((char, index) => {
                const x = canvas.width / 2;
                const y = startY + (index * 120);

                // 各文字を描画する直前に、フチが丸くなる設定を確実に適用（斜めになる・潰れるのを防ぐ）
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                // 一番太い黒フチ
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 26; ctx.strokeText(char, x, y);
                // 真ん中の白フチ
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 14; ctx.strokeText(char, x, y);
                // 内側の細い黒フチ
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 4;  ctx.strokeText(char, x, y);

                // 文字の中身（白〜薄いグレーのグラデーション）
                let textGrad = ctx.createLinearGradient(0, y - 50, 0, y + 50);
                textGrad.addColorStop(0, '#ffffff');
                textGrad.addColorStop(1, '#e6e6e6');
                ctx.fillStyle = textGrad;
                
                // フチの上に文字を塗りつぶすことで、中身が白く残るように修正
                ctx.fillText(char, x, y);
            });
        }
        
        // データを画像要素へ転送
        plateView.src = canvas.toDataURL('image/png');
    }

    bgSelect.addEventListener('change', loadAssets);
    presetSelect.addEventListener('change', loadAssets);
    customInput.addEventListener('input', drawPlate);
    textModeRadios.forEach(radio => radio.addEventListener('change', updateModeVisibility));

    updateModeVisibility();
</script>

</body>
</html>
