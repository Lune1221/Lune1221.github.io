<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓風 縦型段位プレートメーカー</title>
    <link rel="stylesheet" href="Taiko/CSS/style.css">
</head>
<body>

<div class="container">
    <h2>太鼓風 縦型プレートメーカー</h2>
    
    <!-- 1. 背景の板を選ぶ -->
    <div class="control-group">
        <label for="bgSelect">プレートの背景（木目）</label>
        <select id="bgSelect">
            <option value="images/Yellow_Plate.png">五級〜一級（黄色）</option>
            <option value="images/Blue_Plate.png">初段〜五段（青色）</option>
            <option value="images/Red_Plate.png">六段〜十段（赤色）</option>
            <option value="images/Silver_Plate.png">玄人〜超人（銀色）</option>
            <option value="images/Gold_Plate.png">達人（金色）</option>
            <option value="images/Gaiden_Plate.png">外伝（専用）</option>
            <option value="images/White_Plate.png">白（創作等）</option>
        </select>
    </div>

    <!-- 2. 公式パーツの選択（ラジオボタンを廃止し標準化） -->
    <div class="control-group">
        <label for="presetSelect">公式文字パーツ</label>
        <select id="presetSelect">
            <option value="images/TATSUJIN.png">達人</option>
            <option value="images/KUROTO.png">玄人</option>
            <option value="images/CHOJIN.png">超人</option>
            <option value="images/MEIJIN.png">名人</option>
            <option value="images/Gaiden.png">外伝</option>
            <option value="images/Original.png">創作</option>
        </select>
    </div>

    <!-- 3. 文字のレイアウト調整（手動） -->
    <div class="control-group">
        <label>文字のレイアウト調整（手動）</label>
        <div class="slider-panel">
            <div class="slider-row">
                <label>サイズ倍率</label>
                <input type="range" id="sizeSlider" min="30" max="150" value="100">
                <span class="slider-value" id="sizeValue">100%</span>
            </div>
            <div class="slider-row">
                <label>左右位置(X)</label>
                <input type="range" id="xSlider" min="-100" max="100" value="0">
                <span class="slider-value" id="xValue">0</span>
            </div>
            <div class="slider-row">
                <label>上下位置(Y)</label>
                <input type="range" id="ySlider" min="-100" max="100" value="0">
                <span class="slider-value" id="yValue">0</span>
            </div>
        </div>
    </div>
    
    <div class="canvas-container">
        <canvas id="plateCanvas"></canvas>
        <img id="plateView" class="result-image" alt="段位プレート">
        <p class="note">【保存方法】上のプレート画像を長押しして保存してください</p>
        <p style="color: #8a8a9e; font-size: 12px; margin-top: 0; margin-bottom: 15px;">
            ※おすすめ設定目安：サイズ 64% / 左右 -5 / 上下 -40
            <br>
            ※外伝の設定目安：サイズ 64% / 左右 0 / 上下 -20
            <br>
            ※おそらくこのプレートをそのまま入れるとデカくなりすぎてしまうので各自で修正してください
        </p>
    </div>
</div>

<script src="Taiko/JS/script.js"></script>
</body>
</html>
