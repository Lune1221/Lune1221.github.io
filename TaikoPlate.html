<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓風 縦型段位プレートメーカー</title>
    <style>
        @font-face {
            font-family: 'TaikoFont';
            src: url('FOT-大江戸勘亭流 Std E.otf') format('opentype');
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            background: #1a1a2e;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #161623;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2e2e4f;
        }
        .control-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 14px;
            color: #8a8a9e;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 2px solid #4e4e7d;
            background: #0f0f1a;
            color: #fff;
            box-sizing: border-box;
            outline: none;
        }
        select:focus, input[type="text"]:focus {
            border-color: #00fff0;
        }
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }
        .canvas-container {
            margin: 20px 0;
            text-align: center;
        }
        canvas {
            background: transparent;
            max-width: 100%;
            max-height: 450px;
            border-radius: 8px;
        }
        button {
            background: linear-gradient(135deg, #00fff0, #0083ff);
            color: #000;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,255,240,0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <h2>太鼓風 縦型プレートメーカー</h2>
    
    <div class="control-group">
        <label for="bgSelect">プレートの背景（木目）</label>
        <select id="bgSelect">
            <option value="images/Yellow_Plate.png">五級〜一級（黄色）</option>
            <option value="images/Blue_Plate.png">初段〜五段（青色）</option>
            <option value="images/Red_Plate.png">六段〜十段（赤色）</option>
            <option value="images/Silver_Plate.png">玄人〜超人（銀色）</option>
            <option value="images/Gold_Plate.png">達人（金色）</option>
            <option value="images/White_Plate.png">白（創作・外伝など）</option>
        </select>
    </div>

    <div class="control-group">
        <label>文字の配置方法</label>
        <div class="radio-group">
            <label><input type="radio" name="textMode" value="preset" checked> 公式パーツを使う</label>
            <label><input type="radio" name="textMode" value="custom"> 自由に入力する</label>
        </div>
    </div>

    <div class="control-group" id="presetGroup">
        <label for="presetSelect">公式文字パーツ</label>
        <select id="presetSelect">
            <option value="images/TATSUJIN.png">達人</option>
            <option value="images/KUROTO.png">玄人</option>
            <option value="images/CHOJIN.png">超人</option>
            <option value="images/MEIJIN.png">名人</option>
            <option value="images/Gaiden.png">外伝</option>
            <option value="images/Original.png">創作</option>
        </select>
    </div>

    <div class="control-group" id="customGroup" style="display: none;">
        <label for="customInput">自由な文字（※1文字ずつ改行されます）</label>
        <input type="text" id="customInput" value="初段" maxlength="4">
    </div>
    
    <div class="canvas-container">
        <canvas id="plateCanvas" width="240" height="520"></canvas>
    </div>
    
    <button id="downloadBtn">画像を保存する (.png)</button>
</div>

<script>
    const canvas = document.getElementById('plateCanvas');
    const ctx = canvas.getContext('2d');
    
    const bgSelect = document.getElementById('bgSelect');
    const textModeRadios = document.getElementsByName('textMode');
    const presetGroup = document.getElementById('presetGroup');
    const presetSelect = document.getElementById('presetSelect');
    const customGroup = document.getElementById('customGroup');
    const customInput = document.getElementById('customInput');
    const downloadBtn = document.getElementById('downloadBtn');

    let imgBg = new Image();
    let imgText = new Image();

    imgBg.onload = onAssetLoad;
    imgText.onload = onAssetLoad;

    function onAssetLoad() {
        drawPlate();
    }

    function updateModeVisibility() {
        const mode = document.querySelector('input[name="textMode"]:checked').value;
        if (mode === 'preset') {
            presetGroup.style.display = 'block';
            customGroup.style.display = 'none';
        } else {
            presetGroup.style.display = 'none';
            customGroup.style.display = 'block';
        }
        loadAssets();
    }

    function loadAssets() {
        imgBg.src = bgSelect.value;
        const mode = document.querySelector('input[name="textMode"]:checked').value;
        if (mode === 'preset') {
            imgText.src = presetSelect.value;
        } else {
            imgText.src = '';
            drawPlate();
        }
    }

    function drawPlate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (imgBg.complete && imgBg.naturalWidth !== 0) {
            ctx.drawImage(imgBg, 0, 0, canvas.width, canvas.height);
        }

        const mode = document.querySelector('input[name="textMode"]:checked').value;

        if (mode === 'preset') {
            if (imgText.complete && imgText.naturalWidth !== 0) {
                // 【超・微調整ポイント】
                // 本物のバランスに合わせるため、横幅は「0.74倍」、縦幅は少し長めの「0.78倍」に設定
                const scaleX = 0.74; 
                const scaleY = 0.78; 
                
                const w = canvas.width * scaleX;
                const h = canvas.height * scaleY;
                
                // 本物の画像のように「達人」の文字位置を少し中央寄りに下げるため、
                // Xのズレを「-10」、Yのズレを「+5（少し下へ）」に変更しました。
                const x = ((canvas.width - w) / 2) - 10;
                const y = ((canvas.height - h) / 2) + 5; 
                
                ctx.drawImage(imgText, x, y, w, h);
            }
        } else {
            const text = customInput.value || "初段";
            ctx.font = "italic bold 40px 'TaikoFont', 'Hiragino Kaku Gothic ProN', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineJoin = 'round';

            const chars = text.split('');
            const startY = (canvas.height / 2) - ((chars.length - 1) * 30);

            chars.forEach((char, index) => {
                const x = canvas.width / 2;
                const y = startY + (index * 60);

                ctx.strokeStyle = '#000000'; ctx.lineWidth = 12; ctx.strokeText(char, x, y);
                ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6;  ctx.strokeText(char, x, y);
                ctx.strokeStyle = '#000000'; ctx.lineWidth = 2.5; ctx.strokeText(char, x, y);

                let textGrad = ctx.createLinearGradient(0, y - 20, 0, y + 20);
                textGrad.addColorStop(0, '#ffffff');
                textGrad.addColorStop(1, '#cccccc');
                ctx.fillStyle = textGrad;
                ctx.fillText(char, x, y);
            });
        }
    }

    bgSelect.addEventListener('change', loadAssets);
    presetSelect.addEventListener('change', loadAssets);
    customInput.addEventListener('input', drawPlate);
    textModeRadios.forEach(radio => radio.addEventListener('change', updateModeVisibility));

    downloadBtn.addEventListener('click', () => {
        const link = document.createElement('a');
        link.download = 'taiko_plate.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
    });

    updateModeVisibility();
</script>

</body>
</html>
