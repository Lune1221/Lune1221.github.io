<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太鼓の達人 段位プレートメーカー</title>
    <!-- 分離したCSSファイルを読み込む -->
    <link rel="stylesheet" href="Taiko/CSS/style.css">
</head>
<body>

<div class="container">
    <h2>太鼓風 縦型プレートメーカー</h2>
    
    <div class="control-group">
        <label for="bgSelect">プレートの背景（木目）</label>
        <select id="bgSelect">
            <option value="images/Yellow_Plate.png">五級〜一級（黄色）</option>
            <option value="images/Blue_Plate.png">初段〜五段（青色）</option>
            <option value="images/Red_Plate.png">六段〜十段（赤色）</option>
            <option value="images/Silver_Plate.png">玄人〜超人（銀色）</option>
            <option value="images/Gold_Plate.png">達人（金色）</option>
            <option value="images/White_Plate.png">白（創作・外伝など）</option>
        </select>
    </div>

    <div class="control-group">
        <label>文字の配置方法</label>
        <div class="radio-group">
            <label><input type="radio" name="textMode" value="preset" checked> 公式パーツを使う</label>
            <label><input type="radio" name="textMode" value="custom"> 自由に入力する</label>
        </div>
    </div>

    <div class="control-group" id="presetGroup">
        <label for="presetSelect">公式文字パーツ</label>
        <select id="presetSelect">
            <option value="images/TATSUJIN.png">達人</option>
            <option value="images/KUROTO.png">玄人</option>
            <option value="images/CHOJIN.png">超人</option>
            <option value="images/MEIJIN.png">名人</option>
            <option value="images/Gaiden.png">外伝</option>
            <option value="images/Original.png">創作</option>
        </select>
    </div>

    <div class="control-group" id="customGroup" style="display: none;">
        <label for="customInput">自由な文字（※1文字ずつ改行されます）</label>
        <input type="text" id="customInput" value="初段" maxlength="4" style="margin-bottom: 10px;">
        
        <label for="textColorInput">文字の中の色（単色）</label>
        <input type="color" id="textColorInput" value="#ffffff">
    </div>

    <div class="control-group">
        <label>文字のレイアウト調整（手動）</label>
        <div class="slider-panel">
            <div class="slider-row">
                <label>サイズ倍率</label>
                <input type="range" id="sizeSlider" min="30" max="150" value="100">
                <span class="slider-value" id="sizeValue">100%</span>
            </div>
            <div class="slider-row">
                <label>左右位置(X)</label>
                <input type="range" id="xSlider" min="-100" max="100" value="0">
                <span class="slider-value" id="xValue">0</span>
            </div>
            <div class="slider-row">
                <label>上下位置(Y)</label>
                <input type="range" id="ySlider" min="-100" max="100" value="0">
                <span class="slider-value" id="yValue">0</span>
            </div>
        </div>
    </div>
<div class="control-group">
    <p style="color: #ff9f00; font-size: 13px; font-weight: bold; margin-top: 5px; text-align: center; background: rgba(255,159,0,0.1); padding: 8px; border-radius: 6px; border: 1px dashed #ff9f00;">
        公式パーツのおすすめ目安：サイズ 82% | 左右位置 -5 | 上下位置 -40
    </p>
</div>
    <div class="canvas-container">
        <canvas id="plateCanvas"></canvas>
        <img id="plateView" class="result-image" alt="段位プレート">
        <p class="note">【保存方法】上のプレート画像を長押しして保存してください</p>
    </div>
</div>

<!-- 分離したJavaScriptファイルを読み込む -->
<script src="Taiko/JS/script.js"></script>
</body>
</html>
