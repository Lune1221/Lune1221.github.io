<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogg to WAV 変換ツール</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .drop-zone {
            border: 2px dashed #bdc3c7;
            padding: 40px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover {
            background: #f9fbfc;
            border-color: #3498db;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
            text-decoration: none;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
            color: #e67e22;
        }
        .download-area {
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ogg to WAV 変換ツール</h1>
        <p>Oggファイルをブラウザ内でWavファイルに変換します（外部送信なし）</p>

        <div class="drop-zone" id="dropZone">
            <p>ここにOggファイルをドラッグ＆ドロップ<br>または</p>
            <label class="btn" for="fileInput">ファイルを選ぶ</label>
            <input type="file" id="fileInput" accept=".ogg,audio/ogg">
        </div>

        <div id="status"></div>

        <div class="download-area" id="downloadArea"></div>
    </div>

    <script src="OggtoWav/script.js"></script>
</body>
</html>
