<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ogg to WAV 変換ツール</title>
    <!-- ZIP処理用のライブラリ (JSZip & fflate for password zip) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #2c3e50;
        }
        p {
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .drop-zone {
            border: 2px dashed #bdc3c7;
            padding: 30px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover {
            background: #f9fbfc;
            border-color: #3498db;
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            background-color: #3498db;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-block;
            text-decoration: none;
            margin: 5px;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .btn-success {
            background-color: #2ecc71;
        }
        .btn-success:hover {
            background-color: #27ae60;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #e67e22;
        }
        .file-list {
            text-align: left;
            margin-top: 20px;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px;
            background: #fafafa;
        }
        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }
        .file-item:last-child {
            border-bottom: none;
        }
        .actions {
            margin-top: 20px;
        }
        /* パスワード入力モーダル */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 320px;
            text-align: center;
        }
        .modal-content input {
            width: 80%;
            padding: 8px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Ogg to WAV 変換ツール</h1>
        <p>複数のOggファイル、またはZIPファイル（パスワード対応）を一括変換できます</p>

        <div class="drop-zone" id="dropZone">
            <p>ここにOggファイル、またはZIPファイルをドロップ<br>または</p>
            <label class="btn" for="fileInput">ファイルを選ぶ</label>
            <input type="file" id="fileInput" multiple accept=".ogg,audio/ogg,.zip">
        </div>

        <div id="status"></div>

        <div class="file-list" id="fileList" style="display: none;"></div>

        <div class="actions" id="actionArea" style="display: none;">
            <button class="btn btn-success" id="downloadAllBtn">すべて個別にダウンロード</button>
            <button class="btn" id="downloadZipBtn">ZIPにまとめてダウンロード</button>
        </div>
    </div>

    <!-- パスワード入力モーダル -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3>ZIPのパスワードが必要です</h3>
            <p id="modalFileName" style="font-size: 13px; margin: 5px 0 15px 0;"></p>
            <input type="password" id="zipPasswordInput" placeholder="パスワードを入力">
            <br>
            <button class="btn" id="submitPasswordBtn">決定</button>
        </div>
    </div>

    <!-- スクリプトの読み込み（パスを修正済み） -->
    <script src="OggtoWav/script.js"></script>
</body>
</html>
