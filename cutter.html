<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゲージZIP生成</title>
<script src="https://unpkg.com"></script>
</head>
<body style="font-family:sans-serif;padding:20px;">
<h3>大次郎4 リザルトゲージZIP生成ツール</h3>
<p>normagauge.png (横10×縦4) を選択：</p>
<input type="file" id="f" accept="image/*"><br><br>
<div id="status"></div>
<script>
document.getElementById('f').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('status').textContent = '処理中...';
  const img = new Image();
  img.onload = async function() {
    const cw = Math.floor(img.width / 10);
    const ch = Math.floor(img.height / 4);
    const zip = new JSZip();
    const toBlob = (row, col, blank) => new Promise(res => {
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      if (!blank) c.getContext('2d').drawImage(img, col*cw, row*ch, cw, ch, 0, 0, cw, ch);
      c.toBlob(res, 'image/png');
    });
    const f = zip.folder("default/img/result_gauge");
    f.file("base.png", await toBlob(0, 0, false));
    f.file("fill.png", await toBlob(1, 0, false));
    f.file("line.png", await toBlob(0, 0, true));
    const maxF = f.folder("max");
    for (let i = 0; i < 10; i++) {
      maxF.file("0" + i + ".png", await toBlob(3, i, false));
    }
    const b = await zip.generateAsync({type:"base64"});
    location.href = "data:application/zip;base64," + b;
    document.getElementById('status').textContent = '完了！ダウンロードを確認してください';
  };
  img.src = URL.createObjectURL(file);
};
</script></body></html>
